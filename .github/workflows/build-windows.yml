name: Build Windows x86

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # windows-2019 sudah dihentikan GitHub, job jadi tidak pernah dapat runner (stuck Queued).
    # windows-2022 masih tersedia dan tetap bisa build target Win32 / Win7 (0x0601).
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Win32
        shell: cmd
        run: cmake -S . -B build -A Win32

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FontStudio15-Windows-x86
          path: build/Release/FontStudio15.exe
          if-no-files-found: error
